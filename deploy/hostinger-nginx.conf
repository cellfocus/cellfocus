# =============================================================================
# CellFocus Production Nginx Configuration for Hostinger VPS
# Domain: cellfocus.pk / www.cellfocus.pk (or your custom server domain/IP)
# Location on VPS: /etc/nginx/sites-available/cellfocus.conf
# Enable symlink: ln -s /etc/nginx/sites-available/cellfocus.conf /etc/nginx/sites-enabled/
# =============================================================================

# Upstream Node.js API Service managed by PM2
upstream cellfocus_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# 1. HTTP to HTTPS Redirection (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name cellfocus.pk www.cellfocus.pk;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/cellfocus/client/dist;
        allow all;
    }

    # Redirect all remaining HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Secure Production Server Block (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cellfocus.pk www.cellfocus.pk;

    # Production SSL Certificate Paths (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/cellfocus.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cellfocus.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Restore Real Client IP behind Cloudflare or Hostinger Load Balancer
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Maximum client payload size (for base64 product image uploads)
    client_max_body_size 25M;

    # Static Frontend SPA Root directory (Vite build output)
    root /var/www/cellfocus/client/dist;
    index index.html;

    # Gzip Compression for Core Web Vitals performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Production Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Static Assets & Images with Aggressive Browser Caching (1 Year)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Dynamic SEO Sitemaps & Robots Pass-through to Node.js backend
    location = /sitemap.xml {
        proxy_pass http://cellfocus_backend/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://cellfocus_backend/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node.js API Endpoints (/api/*) with WebSocket Upgrade & Proxy Headers
    location /api/ {
        proxy_pass http://cellfocus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Single Page Application (SPA) Fallback
    # Fixes 404 errors on page reloads or deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}

