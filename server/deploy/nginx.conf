# =============================================================================
# CellFocus Production Nginx Configuration
# Multi-Layered Security: IP Whitelisting, HTTP Basic Auth, Rate Limiting & SSL
# Location on Linux: /etc/nginx/sites-available/cellfocus.conf
# =============================================================================

# Upstream Node.js API Service
upstream cellfocus_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name store.cellfocus.pk www.store.cellfocus.pk;

    # Return standard 301 Permanent Redirect
    return 301 https://$host$request_uri;
}

# 2. Main Secure Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name store.cellfocus.pk www.store.cellfocus.pk;

    # Production SSL Configuration
    ssl_certificate /etc/letsencrypt/live/store.cellfocus.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.cellfocus.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Restore Real Client IP behind Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Static Frontend SPA Root (Vite dist build)
    root /var/www/cellfocus/client/dist;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public Storefront SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public REST API (Products Catalog, Customer Checkout)
    location /api/ {
        proxy_pass http://cellfocus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # MULTI-LAYER RESTRICTION: ADMINISTRATIVE GATEWAY (Nginx Edge Barrier)
    # =========================================================================
    location /api/admin/ {
        # Layer 1: IP Whitelisting (Replace with your actual Static / VPN IP)
        # allow 203.0.113.45;     # Primary Office Static IP
        # allow 198.51.100.22;    # VPN / Secondary Admin IP
        # deny all;

        # Layer 2: HTTP Basic Authentication (.htpasswd)
        auth_basic "Restricted CellFocus Admin Zone";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://cellfocus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block Automated Probing on Common Vulnerability Paths
    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.env|\.git) {
        return 404;
    }
}

